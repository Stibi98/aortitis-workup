function computeScores(activeFeatures) {
  const scores = {};

  FEATURE_GROUPS.forEach(group => {
    group.features.forEach(feat => {
      if (activeFeatures[feat.id]) {
        Object.entries(feat.weights).forEach(([etio, w]) => {
          scores[etio] = (scores[etio] || 0) + w;
        });
      }
    });
  });
  return scores;
}

    group.features.forEach(feat => {
      Object.entries(feat.weights).forEach(([etio, w]) => {
        maxScores[etio] = (maxScores[etio] || 0) + w;
      });
    });
  });

}
